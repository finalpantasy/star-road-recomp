; Star Road Recomp default keyboard map (task-22). Copy this file to input.ini beside smrpg.exe (or pass --input-config PATH, or set
; SMRPG_INPUT_CONFIG) and edit the copy: any line you leave out keeps its built-in default.
; Format: NAME = KEY[, KEY]   (two keys per button at most; KEY is an SDL scancode name such as K, Return, Left Shift, Keypad 8)
; Buttons: A B X Y L R ZL ZR PLUS MINUS LSTICK RSTICK LEFT UP RIGHT DOWN
; Sticks (one key per direction): STICK_UP STICK_DOWN STICK_LEFT STICK_RIGHT RSTICK_UP RSTICK_DOWN RSTICK_LEFT RSTICK_RIGHT
; The face buttons follow the Pro Controller layout on the right hand: L is A (right), K is B (bottom), I is X (top), J is Y (left).
; Gamepads need no map: SDL's controller database handles them, the east button is A, the south button is B.
[keyboard]
A = L, Space
B = K
X = I
Y = J
L = Q
R = E
ZL = 1
ZR = 3
LSTICK = Left Shift
RSTICK = Right Shift
PLUS = Return
MINUS = Backspace
LEFT = Left
UP = Up
RIGHT = Right
DOWN = Down
STICK_UP = W
STICK_DOWN = S
STICK_LEFT = A
STICK_RIGHT = D
RSTICK_UP = Keypad 8
RSTICK_DOWN = Keypad 5
RSTICK_LEFT = Keypad 4
RSTICK_RIGHT = Keypad 6
