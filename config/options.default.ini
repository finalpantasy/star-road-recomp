; Star Road Recomp options. The in-game overlay writes this file (F1, or L + R + MINUS on a controller); you can also edit it while the game runs (most options apply live, the rest say so).
; Copy config/options.default.ini to options.ini beside smrpg.exe, or point SMRPG_OPTIONS at a file. A missing key keeps its default.

[display]
; windowed or fullscreen (borderless desktop). Applies live when the window is shown (--window). (applies live)
; values: windowed fullscreen
window_mode = windowed
; off is the faithful picture (a plain scale). fsr1 and fsr2 are AMD FidelityFX spatial upscalers. (applies live)
; values: off fsr1 fsr2
upscale = off
; size of the upscaled picture: window (the window size) or a fixed 1080p, 1440p or 2160p image. (applies live)
; values: window 1080p 1440p 2160p
upscale_target = window
; RCAS sharpening after upscaling: off, or from sharpest to soft. Only used when upscaling is on. (applies live)
; values: off sharpest strong default mild soft
sharpness = default

[performance]
; game adds no limit (the game's own pacing and vsync). A number caps presented frames per second. (applies live)
; values: game 30 60 90 120 144 240
fps_cap = game

[audio]
; on opens the real playback device when audout starts. A running null sink cannot be promoted to a device, so restart is required. (applies on restart)
; values: off on
enabled = off
; master volume of the audio output, 0 to 100. (applies live)
; range: 0 to 100
volume = 100

[controls]
; ini file with the keyboard bindings (config/input.default.ini shows the format). Empty: input.ini beside the exe, else input.default.ini. (applies live)
input_map = 

[gameplay]
; off is the game as shipped. on unlocks the post-game boss rematches without playing through. Applies on save load or new game.
; values: off on
unlock_postgame = off
; off is faithful. hard raises monster stats from the data table. The runtime caches the transformed monster.tbl once per run, so restart is required. (applies on restart)
; values: off hard
difficulty_plus = off
; hard mode HP multiplier, from 100% to 400%. Default 150%. monster.tbl is cached once per run, so restart is required. (applies on restart)
; range: 100 to 400
difficulty_plus_hp_percent = 150
; hard mode attack, defense, magic attack and magic defense multiplier. Default 125%. monster.tbl is cached once per run, so restart is required. (applies on restart)
; range: 100 to 400
difficulty_plus_damage_percent = 125
; HP multiplier for monster IDs listed in difficulty_plus_boss_ids in options.ini. Default 150%. monster.tbl is cached once per run, so restart is required. (applies on restart)
; range: 100 to 400
difficulty_plus_boss_hp_percent = 150
; Attack, defense, magic attack and magic defense multiplier for IDs in difficulty_plus_boss_ids. Default 125%. monster.tbl is cached once per run, so restart is required. (applies on restart)
; range: 100 to 400
difficulty_plus_boss_damage_percent = 125
; Optional boss-specific factors use an explicit comma-separated monster ID list: difficulty_plus_boss_ids = 12, 18
